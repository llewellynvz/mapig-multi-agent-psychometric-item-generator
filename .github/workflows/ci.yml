name: CI

on:
  push:
    branches: [Psynalytics, main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      APP_MODE: mock
      SEARCH_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: Import smoke test
        run: python -c "import backend.main"
      - name: Run backend tests (skipped when tests/ is not published)
        run: |
          if [ -d tests ]; then
            pytest tests/ -q
          else
            echo "tests/ not present in repository; skipping pytest"
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npx vitest run
      - run: npm run build
