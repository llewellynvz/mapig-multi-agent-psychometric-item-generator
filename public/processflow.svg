<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <!-- Gradients & filters -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a7d12b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a7d12b" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.04"/>
    </linearGradient>

    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a7d12b" opacity="0.85"/>
    </marker>
    <marker id="arrowhead-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1440" height="980" fill="url(#bgGrad)"/>

  <!-- Title -->
  <g>
    <text x="720" y="46" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">MAPIG · System Architecture</text>
    <text x="720" y="72" text-anchor="middle" fill="#94a3b8" font-size="13">Multi-agent psychometric item generator · 17 specialised agents · Next.js + FastAPI + LangGraph</text>
  </g>

  <!-- LAYER 1: Frontend (top) -->
  <g transform="translate(60, 110)">
    <rect width="1320" height="120" rx="10" fill="url(#cyanGrad)" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="20" y="28" fill="#22d3ee" font-size="13" font-weight="700" letter-spacing="1">FRONTEND</text>
    <text x="20" y="50" fill="#e2e8f0" font-size="16" font-weight="600">Next.js 16 (App Router) · TypeScript · shadcn/ui · TanStack Query</text>

    <!-- Frontend components row -->
    <g transform="translate(20, 68)" font-size="11" fill="#cbd5e1">
      <g><rect width="180" height="38" rx="4" fill="#0f172a" stroke="#334155"/><text x="90" y="16" text-anchor="middle" font-weight="600">InstrumentSetupForm</text><text x="90" y="30" text-anchor="middle" fill="#94a3b8" font-size="9">construct · population · scale</text></g>
      <g transform="translate(196,0)"><rect width="160" height="38" rx="4" fill="#0f172a" stroke="#334155"/><text x="80" y="16" text-anchor="middle" font-weight="600">ProgressIndicator</text><text x="80" y="30" text-anchor="middle" fill="#94a3b8" font-size="9">SSE stream · stages</text></g>
      <g transform="translate(372,0)"><rect width="160" height="38" rx="4" fill="#0f172a" stroke="#334155"/><text x="80" y="16" text-anchor="middle" font-weight="600">PFAPanel</text><text x="80" y="30" text-anchor="middle" fill="#94a3b8" font-size="9">CFA path diagram · η, λ, ε, φ</text></g>
      <g transform="translate(548,0)"><rect width="160" height="38" rx="4" fill="#0f172a" stroke="#334155"/><text x="80" y="16" text-anchor="middle" font-weight="600">ExpertPanelCard</text><text x="80" y="30" text-anchor="middle" fill="#94a3b8" font-size="9">verdict α · Spearman ρ</text></g>
      <g transform="translate(724,0)"><rect width="160" height="38" rx="4" fill="#0f172a" stroke="#334155"/><text x="80" y="16" text-anchor="middle" font-weight="600">PersonaValidationCard</text><text x="80" y="30" text-anchor="middle" fill="#94a3b8" font-size="9">cognitive interviews</text></g>
      <g transform="translate(900,0)"><rect width="160" height="38" rx="4" fill="#0f172a" stroke="#334155"/><text x="80" y="16" text-anchor="middle" font-weight="600">CorrelationPanel</text><text x="80" y="30" text-anchor="middle" fill="#94a3b8" font-size="9">McDonald's ω · heatmap</text></g>
      <g transform="translate(1076,0)"><rect width="200" height="38" rx="4" fill="#0f172a" stroke="#334155"/><text x="100" y="16" text-anchor="middle" font-weight="600">GeneratedItemsTable + Export</text><text x="100" y="30" text-anchor="middle" fill="#94a3b8" font-size="9">CSV · JSON · Markdown</text></g>
    </g>
  </g>

  <!-- Arrow: Frontend → API -->
  <line x1="720" y1="232" x2="720" y2="262" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead-slate)"/>
  <text x="730" y="250" fill="#94a3b8" font-size="11" font-style="italic">SSE / HTTP</text>

  <!-- LAYER 2: API -->
  <g transform="translate(60, 268)">
    <rect width="1320" height="60" rx="10" fill="url(#purpleGrad)" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="20" y="24" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="1">API LAYER</text>
    <text x="20" y="46" fill="#e2e8f0" font-size="14" font-weight="600">FastAPI 0.128 · uvicorn · /v1/generate-items-stream · /v1/runs/&#123;run_id&#125; · /healthz</text>
    <text x="1300" y="36" text-anchor="end" fill="#94a3b8" font-size="11" font-style="italic">backend/main.py · api/index.py</text>
  </g>

  <!-- Arrow: API → Orchestration -->
  <line x1="720" y1="330" x2="720" y2="360" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowhead-slate)"/>

  <!-- LAYER 3: LangGraph Orchestration with 17 agents grouped -->
  <g transform="translate(60, 366)">
    <rect width="1320" height="430" rx="10" fill="url(#limeGrad)" stroke="#a7d12b" stroke-opacity="0.55" stroke-width="1.8"/>
    <text x="20" y="28" fill="#a7d12b" font-size="13" font-weight="700" letter-spacing="1">LANGGRAPH ORCHESTRATION</text>
    <text x="20" y="50" fill="#e2e8f0" font-size="14" font-weight="600">graph.py · in-memory checkpointing · 17 specialised agents grouped by responsibility</text>
    <text x="1300" y="40" text-anchor="end" fill="#94a3b8" font-size="11" font-style="italic">backend/graph.py · backend/agents/</text>

    <!-- 7 group columns showing all 17 agents -->
    <!-- Group 1: Evidence -->
    <g transform="translate(20, 70)">
      <rect width="180" height="340" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="90" y="20" text-anchor="middle" fill="#a7d12b" font-size="10" font-weight="700" letter-spacing="0.6">EVIDENCE</text>
      <line x1="20" y1="28" x2="160" y2="28" stroke="#334155"/>
      <g font-size="10.5" fill="#e2e8f0">
        <text x="14" y="50" font-weight="600">1 · Retrieval Agent</text>
        <text x="14" y="64" fill="#94a3b8" font-size="9.5">local approved sources</text>
        <text x="14" y="76" fill="#94a3b8" font-size="9.5">no LLM · zero cost</text>

        <text x="14" y="100" font-weight="600">2 · Web Surfer</text>
        <text x="14" y="114" fill="#94a3b8" font-size="9.5">Perplexity sonar-pro</text>
        <text x="14" y="126" fill="#94a3b8" font-size="9.5">academic domain allow-list</text>
        <text x="14" y="138" fill="#94a3b8" font-size="9.5">→ 15-25 evidence chunks</text>
      </g>
    </g>

    <!-- Group 2: Construct architecture -->
    <g transform="translate(210, 70)">
      <rect width="160" height="340" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="80" y="20" text-anchor="middle" fill="#a7d12b" font-size="10" font-weight="700" letter-spacing="0.6">ARCHITECTURE</text>
      <line x1="20" y1="28" x2="140" y2="28" stroke="#334155"/>
      <g font-size="10.5" fill="#e2e8f0">
        <text x="14" y="50" font-weight="600">3 · Facet Mapper</text>
        <text x="14" y="64" fill="#94a3b8" font-size="9.5">Sonnet 4.5</text>
        <text x="14" y="76" fill="#94a3b8" font-size="9.5">unidim / multi-dim</text>
        <text x="14" y="88" fill="#94a3b8" font-size="9.5">prevents synonyms</text>
      </g>
    </g>

    <!-- Group 3: Item creation + quality gate -->
    <g transform="translate(380, 70)">
      <rect width="180" height="340" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="90" y="20" text-anchor="middle" fill="#a7d12b" font-size="10" font-weight="700" letter-spacing="0.6">ITEMS &amp; GATE</text>
      <line x1="20" y1="28" x2="160" y2="28" stroke="#334155"/>
      <g font-size="10.5" fill="#e2e8f0">
        <text x="14" y="50" font-weight="600">4 · Item Writer</text>
        <text x="14" y="64" fill="#94a3b8" font-size="9.5">Sonnet 4.5 · always</text>
        <text x="14" y="76" fill="#94a3b8" font-size="9.5">over-generates 1.3×</text>

        <text x="14" y="100" font-weight="600">5 · Validator</text>
        <text x="14" y="114" fill="#94a3b8" font-size="9.5">Sonnet → Opus retry</text>
        <text x="14" y="126" fill="#94a3b8" font-size="9.5">4-dim weighted score</text>

        <text x="14" y="150" font-weight="600">6 · Persona Validator</text>
        <text x="14" y="164" fill="#94a3b8" font-size="9.5">GPT-5.4-mini · 3 personas</text>
        <text x="14" y="176" fill="#94a3b8" font-size="9.5">cognitive interview</text>
      </g>
    </g>

    <!-- Group 4: Triple review -->
    <g transform="translate(570, 70)">
      <rect width="180" height="340" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="90" y="20" text-anchor="middle" fill="#a7d12b" font-size="10" font-weight="700" letter-spacing="0.6">TRIPLE REVIEW</text>
      <text x="90" y="32" text-anchor="middle" fill="#94a3b8" font-size="8.5">parallel</text>
      <line x1="20" y1="38" x2="160" y2="38" stroke="#334155"/>
      <g font-size="10.5" fill="#e2e8f0">
        <text x="14" y="60" font-weight="600">7 · Linguistic Reviewer</text>
        <text x="14" y="74" fill="#94a3b8" font-size="9.5">Sonnet 4.5</text>
        <text x="14" y="86" fill="#94a3b8" font-size="9.5">readability · idioms</text>

        <text x="14" y="110" font-weight="600">8 · Bias Reviewer</text>
        <text x="14" y="124" fill="#94a3b8" font-size="9.5">GPT-5.4-mini · 7 DIF types</text>
        <text x="14" y="136" fill="#94a3b8" font-size="9.5">construct-level filter</text>

        <text x="14" y="160" font-weight="600">9 · Content Reviewer</text>
        <text x="14" y="174" fill="#94a3b8" font-size="9.5">Sonnet 4.5</text>
        <text x="14" y="186" fill="#94a3b8" font-size="9.5">construct correspondence</text>
      </g>
    </g>

    <!-- Group 5: Decision + revise -->
    <g transform="translate(760, 70)">
      <rect width="180" height="340" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="90" y="20" text-anchor="middle" fill="#a7d12b" font-size="10" font-weight="700" letter-spacing="0.6">DECIDE &amp; REVISE</text>
      <text x="90" y="32" text-anchor="middle" fill="#94a3b8" font-size="8.5">loop · max 3 rounds</text>
      <line x1="20" y1="38" x2="160" y2="38" stroke="#334155"/>
      <g font-size="10.5" fill="#e2e8f0">
        <text x="14" y="60" font-weight="600">10 · Critic</text>
        <text x="14" y="74" fill="#94a3b8" font-size="9.5">GPT-5.4-mini · 90% rule-based</text>
        <text x="14" y="86" fill="#94a3b8" font-size="9.5">adaptive thresholds</text>
        <text x="14" y="98" fill="#94a3b8" font-size="9.5">stagnation detect</text>

        <text x="14" y="122" font-weight="600">11 · Meta Editor</text>
        <text x="14" y="136" fill="#94a3b8" font-size="9.5">Sonnet 4.5 · always</text>
        <text x="14" y="148" fill="#94a3b8" font-size="9.5">surgical revisions</text>
        <text x="14" y="160" fill="#94a3b8" font-size="9.5">polarity guard</text>
      </g>
    </g>

    <!-- Group 6: Pre-calibration structure -->
    <g transform="translate(950, 70)">
      <rect width="190" height="340" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="95" y="20" text-anchor="middle" fill="#a7d12b" font-size="10" font-weight="700" letter-spacing="0.6">PRE-CALIBRATION</text>
      <line x1="20" y1="28" x2="170" y2="28" stroke="#334155"/>
      <g font-size="10.5" fill="#e2e8f0">
        <text x="14" y="50" font-weight="600">12 · PFA Pruning</text>
        <text x="14" y="64" fill="#94a3b8" font-size="9.5">embedding-3-large + EFA</text>
        <text x="14" y="76" fill="#94a3b8" font-size="9.5">oblimin · sign-aligned</text>
        <text x="14" y="88" fill="#94a3b8" font-size="9.5">4-rule retention</text>

        <text x="14" y="112" font-weight="600">13 · Expert Panel</text>
        <text x="14" y="126" fill="#94a3b8" font-size="9.5">GPT-5.4-mini × 3</text>
        <text x="14" y="138" fill="#94a3b8" font-size="9.5">psychometric / domain /</text>
        <text x="14" y="150" fill="#94a3b8" font-size="9.5">localization · 1 debate round</text>
        <text x="14" y="162" fill="#94a3b8" font-size="9.5">verdict α · Spearman ρ</text>
      </g>
    </g>

    <!-- Group 7: Post-final analytics -->
    <g transform="translate(1150, 70)">
      <rect width="150" height="340" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="75" y="20" text-anchor="middle" fill="#a7d12b" font-size="10" font-weight="700" letter-spacing="0.6">ANALYTICS</text>
      <text x="75" y="32" text-anchor="middle" fill="#94a3b8" font-size="8.5">parallel</text>
      <line x1="20" y1="38" x2="130" y2="38" stroke="#334155"/>
      <g font-size="10.5" fill="#e2e8f0">
        <text x="10" y="60" font-weight="600">14 · Correlation</text>
        <text x="10" y="74" fill="#94a3b8" font-size="9.5">McDonald's ω · r matrix</text>

        <text x="10" y="98" font-weight="600">15 · PFA Analytics</text>
        <text x="10" y="112" fill="#94a3b8" font-size="9.5">final factor structure</text>
        <text x="10" y="124" fill="#94a3b8" font-size="9.5">Tucker's φ · RMSR · CAF</text>

        <text x="10" y="148" font-weight="600">16 · Instrument Search</text>
        <text x="10" y="162" fill="#94a3b8" font-size="9.5">conv. + discr. instruments</text>

        <text x="10" y="186" font-weight="600">17 · Validity Scorer</text>
        <text x="10" y="200" fill="#94a3b8" font-size="9.5">GPT-5.2 reasoning</text>
        <text x="10" y="212" fill="#94a3b8" font-size="9.5">+ plagiarism check</text>
      </g>
    </g>
  </g>

  <!-- Arrow: Orchestration → External -->
  <line x1="720" y1="800" x2="720" y2="830" stroke="#a7d12b" stroke-width="2" marker-end="url(#arrowhead-slate)"/>

  <!-- LAYER 4: External services + data stores -->
  <g transform="translate(60, 836)">
    <rect width="1320" height="120" rx="10" fill="url(#amberGrad)" stroke="#f59e0b" stroke-opacity="0.42" stroke-width="1.5"/>
    <text x="20" y="26" fill="#f59e0b" font-size="13" font-weight="700" letter-spacing="1">EXTERNAL SERVICES &amp; DATA</text>

    <!-- Provider boxes -->
    <g transform="translate(20, 44)">
      <g><rect width="180" height="62" rx="6" fill="#0f172a" stroke="#334155"/>
         <text x="90" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">Anthropic Claude</text>
         <text x="90" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">Sonnet 4.5 · Opus 4.6</text>
         <text x="90" y="50" text-anchor="middle" fill="#94a3b8" font-size="9">prompt caching enabled</text>
      </g>
      <g transform="translate(196, 0)"><rect width="180" height="62" rx="6" fill="#0f172a" stroke="#334155"/>
         <text x="90" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">OpenAI</text>
         <text x="90" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">GPT-5.4-mini · GPT-5.2</text>
         <text x="90" y="50" text-anchor="middle" fill="#94a3b8" font-size="9">embed-3-small · embed-3-large</text>
      </g>
      <g transform="translate(392, 0)"><rect width="180" height="62" rx="6" fill="#0f172a" stroke="#334155"/>
         <text x="90" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">Perplexity</text>
         <text x="90" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">sonar-pro · academic mode</text>
         <text x="90" y="50" text-anchor="middle" fill="#94a3b8" font-size="9">domain-allow-list filtered</text>
      </g>
      <g transform="translate(610, 0)"><rect width="180" height="62" rx="6" fill="#0f172a" stroke="#334155"/>
         <text x="90" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">data/approved_sources/</text>
         <text x="90" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">curated research library</text>
         <text x="90" y="50" text-anchor="middle" fill="#94a3b8" font-size="9">item writing guidelines</text>
      </g>
      <g transform="translate(806, 0)"><rect width="180" height="62" rx="6" fill="#0f172a" stroke="#334155"/>
         <text x="90" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">data/known_instrument_items/</text>
         <text x="90" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">plagiarism reference</text>
         <text x="90" y="50" text-anchor="middle" fill="#94a3b8" font-size="9">SWLS · FS · MBI · …</text>
      </g>
      <g transform="translate(1002, 0)"><rect width="180" height="62" rx="6" fill="#0f172a" stroke="#334155"/>
         <text x="90" y="20" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">backend/prompts/</text>
         <text x="90" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">15 agent system prompts</text>
         <text x="90" y="50" text-anchor="middle" fill="#94a3b8" font-size="9">.md · loaded on demand</text>
      </g>
      <g transform="translate(1198, 0)"><rect width="98" height="62" rx="6" fill="#0f172a" stroke="#a7d12b" stroke-opacity="0.5"/>
         <text x="49" y="20" text-anchor="middle" fill="#a7d12b" font-size="11" font-weight="700">Vercel</text>
         <text x="49" y="36" text-anchor="middle" fill="#94a3b8" font-size="9">deployment</text>
         <text x="49" y="50" text-anchor="middle" fill="#94a3b8" font-size="9">300s timeout</text>
      </g>
    </g>
  </g>
</svg>
