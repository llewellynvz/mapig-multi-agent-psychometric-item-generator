[project]
name = "mapig"
version = "0.1.0"
description = "A multi-agent orchestrator for Psychometric Self-Report Item Generation(LangGraph + Azure OpenAI)"
authors = [{name = "Prof. Llewellyn E. Van Zyl", email = "llewellyn101@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph==1.0.6",
    "langgraph-checkpoint-sqlite==3.0.3",
    "langchain-core>=1.2.15",
    "langchain-openai>=1.1.7",
    "langchain-anthropic>=1.3.4",
    "anthropic>=0.84.0",
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "httpx==0.28.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "factor-analyzer>=0.5.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    # OpenAI SDK's ParsedResponse has a 21-variant discriminated union.
    # Pydantic v2 emits UserWarning for each non-matching variant during serialization.
    # Data parses correctly; warnings are cosmetic. Suppress to keep test output clean.
    "ignore:.*serialized value may not be as expected.*:UserWarning",
    "ignore:.*Pydantic serializer warnings.*:UserWarning",
    # Pydantic v1 deprecation on Python 3.14+ — comes from langchain_core importing
    # pydantic.v1 for backward compatibility. Upstream issue.
    "ignore:.*Core Pydantic V1 functionality isn.t compatible with Python 3.14.*:UserWarning",
    # joblib serial-mode warning on serverless (Vercel has no shared-memory parallelism).
    "ignore:.*joblib will operate in serial mode.*:UserWarning",
    # factor-analyzer's "no rotation" warning when n_factors==1 (correct unidim case).
    "ignore:.*No rotation will be performed when the number of factors equals 1.*:UserWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
